
name: CI

run-name: ${{ github.actor }} is testing out GitHub Actions 🚀

on: [push, pull_request]

jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest
    steps:
      - run: echo "🎉 The job was automatically triggered by a `${{ github.event_name }}` event."
      - run: echo "🐧 This job is now running on the `ubuntu-latest` runner."

      - name: Check out repository code
        uses: actions/checkout@v6

      - run: echo "💡 The **${{ github.repository }}** repository has been cloned to the runner."
      - run: echo "🖥️ The workflow is now ready to test your code on the runner."

      - name: List files in the repository
        run: ls -la "${{ github.workspace }}"

      - run: echo "🍏 The job's status is currently ${{ job.status }}."

  ingestion-tests:
    name: Ingestion tests (offline, real corpus)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run the offline ingestion suite
        # Exclude live tests that require API keys or external services.
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest tests -m "not live" -q
